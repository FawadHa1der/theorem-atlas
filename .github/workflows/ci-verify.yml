name: CI · Lean 4.33.0 Kernel & Observatory E2E Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-lean4-and-observatory:
    name: Verify Zero-Sorry Lean 4 Corpus & Unified Chrome/Safari Observatory E2E Checks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.12 & Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache Lean 4 elan toolchain & .lake build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake
          key: lean4-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'CommonGround/**/*.lean') }}
          restore-keys: |
            lean4-${{ runner.os }}-

      - name: Install Lean 4 toolchain from lean-toolchain (elan)
        run: |
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"

      - name: Compile Lean 4.33.0 modules & verify 0 sorry across all unrestricted-size .lean files
        run: |
          python3 -B observatory/scripts/compile-all-lean4.py

      - name: Reconstruct bundle-data.js & build unified Chrome/Safari <25 MiB shards
        run: |
          python3 -B observatory/scripts/reconstruct-bundle-data.py --force
          python3 -B observatory/scripts/build-cloudflare-dist.py

      - name: Run Automated UX, DOM Click, Provenance & Unified file:// E2E checks (Node VM)
        run: |
          bash observatory/tests/run-tests.sh
